# order-trace 조회 경로 설정 예시
#
# 테이블명은 모두 TODO_ 로 시작하는 자리표시다. 컬럼명(ORD_NO, MO_NO, COIL_NO 등)도 가정이다.
# 레거시 MES·APS의 실제 이름으로 바꾼 뒤 `python order_trace.py check --config <파일>` 로 검사한다.
# 바꾼 설정은 trace_path.yaml 로 저장한다(실제 테이블명이 들어가므로 저장소에 올릴지는 보안 담당과 정한다).
#
# 노드 하나 = 테이블 하나. parent 와 join(자기 컬럼: 부모 컬럼)으로 주문에서 아래로 이어진다.
#   key          행을 구별하는 컬럼
#   lineage      분할로 생긴 자식 코일을 따라갈 때 쓴다(key_column, parent_column)
#   time_column  있으면 timeline.csv 에 넣는다. event_columns 는 함께 적을 상태 컬럼
#   diagram      true 면 lineage.mmd 계보도에 그린다
#   columns      생략하면 전체 컬럼을 뽑는다. 개인정보가 있는 테이블은 필요한 컬럼만 적는다
#   custom_sql   join 으로 표현하기 어려운 노드는 SELECT 문을 직접 쓴다(:order_no 바인드 사용 가능)

dialect: oracle          # oracle: CONNECT BY 로 분할 계보를 따라간다. ansi: 재귀 CTE(시험용)

nodes:
  order:
    label: 주문
    table: TODO_ORDER_HDR
    key: [ORD_NO]
    filter: "ORD_NO = :order_no"
    diagram: true

  order_item:
    label: 주문품목
    parent: order
    table: TODO_ORDER_ITEM
    key: [ORD_NO, ORD_SEQ]
    join: {ORD_NO: ORD_NO}
    diagram: true

  # 주문 Match 변경(요구 3.20.2)이 있으면 MO가 처음 주문과 다른 주문에 붙어 있을 수 있다.
  # Match 이력 테이블이 따로 있으면 order_item 과 mo 사이에 노드를 하나 더 둔다.
  mo:
    label: MO
    parent: order_item
    table: TODO_MO
    key: [MO_NO]
    join: {ORD_NO: ORD_NO, ORD_SEQ: ORD_SEQ}
    diagram: true

  work_order:
    label: 작업지시
    parent: mo
    table: TODO_WORK_ORDER
    key: [WO_NO]
    join: {MO_NO: MO_NO}
    time_column: ISSUE_DT
    event_columns: [PROC_CD, WO_STAT_CD]

  # 입측분할(요구 3.12.9)로 새 코일번호가 생긴다. 모코일에서 시작해 자코일을 모두 따라간다.
  coil:
    label: 코일
    parent: mo
    table: TODO_COIL
    key: [COIL_NO]
    join: {MO_NO: MO_NO}
    lineage: {key_column: COIL_NO, parent_column: MOTHER_COIL_NO}
    diagram: true

  progress:
    label: 진도 이력
    parent: coil
    table: TODO_COIL_PRGS_HIST
    key: [COIL_NO, HIST_SEQ]
    join: {COIL_NO: COIL_NO}
    time_column: CHG_DT
    event_columns: [PRGS_CD, WORK_STAT_CD, PROC_CD]

  judgement:
    label: 품질판정
    parent: coil
    table: TODO_QLTY_JDG
    key: [COIL_NO, JDG_SEQ]
    join: {COIL_NO: COIL_NO}
    time_column: JDG_DT
    event_columns: [JDG_CD, GRADE_CD]

  ship_lot_item:
    label: 출하 LOT
    parent: coil
    table: TODO_SHIP_LOT_ITEM
    key: [LOT_NO, COIL_NO]
    join: {COIL_NO: COIL_NO}
    diagram: true

  # 출하 한 건에 코일 여러 개가 모인다. links.csv 에는 모든 연결이 남는다.
  shipment:
    label: 출하
    parent: ship_lot_item
    table: TODO_SHIPMENT
    key: [SHIP_NO]
    join: {LOT_NO: LOT_NO}
    columns: [SHIP_NO, LOT_NO, SHIP_DT, SHIP_STAT_CD, CAR_NO]   # 기사 이름·연락처는 뽑지 않는다
    time_column: SHIP_DT
    event_columns: [SHIP_STAT_CD]
    diagram: true

  # ERP 생산실적 송신(요구 3.20.16, I/F B47S3004)
  erp_send:
    label: ERP 실적 송신
    parent: coil
    table: TODO_IF_ERP_PRDN
    key: [IF_SEQ]
    join: {COIL_NO: COIL_NO}
    time_column: SEND_DT
    event_columns: [IF_ID, EVENT_CD, SEND_STAT]

# 스냅샷과 산출물에 넣기 전에 가린다. hash 는 환경변수 ORDER_TRACE_SALT 의 비밀값으로 HMAC을 건다.
# 같은 값은 같은 해시가 되므로 파일끼리 비교는 된다. 대상은 보안 담당이 승인한다.
mask:
  order:
    CUST_NM: hash
    UNIT_PRICE: drop
  shipment:
    CAR_NO: hash
    DRIVER_NM: drop
    DRIVER_TEL: drop

# 변형 주문 후보 선정 쿼리. 합성 데이터를 만들지 않고, 해당 사건이 실제로 있었던 최근 출하 완료 주문을 찾는다.
variants:
  split: |
    SELECT o.ORD_NO, MAX(s.SHIP_DT) AS LAST_SHIP_DT
      FROM TODO_ORDER_HDR o
      JOIN TODO_MO m ON m.ORD_NO = o.ORD_NO
      JOIN TODO_COIL c ON c.MO_NO = m.MO_NO
      JOIN TODO_SHIP_LOT_ITEM li ON li.COIL_NO = c.COIL_NO
      JOIN TODO_SHIPMENT s ON s.LOT_NO = li.LOT_NO
     WHERE c.MOTHER_COIL_NO IS NOT NULL
       AND o.ORD_STAT_CD = 'TODO_출하완료'
     GROUP BY o.ORD_NO
     ORDER BY 2 DESC
     FETCH FIRST 20 ROWS ONLY
  reject_rejudge: |
    SELECT o.ORD_NO, COUNT(*) AS JDG_CNT
      FROM TODO_ORDER_HDR o
      JOIN TODO_MO m ON m.ORD_NO = o.ORD_NO
      JOIN TODO_COIL c ON c.MO_NO = m.MO_NO
      JOIN TODO_QLTY_JDG j ON j.COIL_NO = c.COIL_NO
     WHERE o.ORD_STAT_CD = 'TODO_출하완료'
     GROUP BY o.ORD_NO
    HAVING COUNT(DISTINCT j.JDG_CD) > 1
     ORDER BY 2 DESC
     FETCH FIRST 20 ROWS ONLY
  ccl: |
    SELECT o.ORD_NO
      FROM TODO_ORDER_HDR o
     WHERE o.ORD_STAT_CD = 'TODO_출하완료'
       AND o.LINE_CD = 'TODO_CCL'
     ORDER BY o.ORD_NO DESC
     FETCH FIRST 20 ROWS ONLY
